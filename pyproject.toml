[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-app-framework"
dynamic = ["version"]
description = "Import owned GPT configurations into standalone OpenAI applications"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["gptapps"]

[tool.setuptools.dynamic]
version = {attr = "gptapps.version.VERSION"}

[project.scripts]
gptapps = "gptapps.cli:main"

[tool.setuptools.package-data]
gptapps = ["chat.html", "chat.js", "knowledge.js", "attachments.js", "chat.css", "LICENSE", "templates/*", "templates/.dockerignore", "vendor/*", "icons/*"]
